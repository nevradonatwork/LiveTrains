name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Setting the secret via wrangler CLI here (instead of Cloudflare's
      # own dashboard) is deliberate: several attempts to set CONSUMER_KEY
      # as a runtime secret through Cloudflare's dashboard UI (its
      # Deployments build config, its Bindings tab) all left the deployed
      # Worker's env.CONSUMER_KEY undefined. Doing it here reuses the same
      # CONSUMER_KEY GitHub secret the LDBWS fetch workflow already uses
      # reliably.
      # Deploy first, then set the secret: wrangler refuses `secret put`
      # if the latest uploaded version isn't the currently deployed one
      # (a safety check against attaching a secret to an undeployed
      # version), which an earlier version of this workflow hit.
      - name: Deploy Worker and set CONSUMER_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          # Cloudflare's GitHub-connected "Workers Builds" can upload a
          # preview version of its own at the same moment (it runs on
          # every branch push), which makes `secret put` refuse with
          # "the latest version of your Worker isn't currently deployed"
          # even right after a deploy. Redeploy and retry a few times
          # before giving up.
          for attempt in 1 2 3 4; do
            if echo "${{ secrets.CONSUMER_KEY }}" | npx wrangler secret put CONSUMER_KEY; then
              exit 0
            fi
            echo "secret put refused (attempt $attempt); redeploying and retrying in 20s"
            sleep 20
            npx wrangler deploy
          done
          echo "secret put kept failing after 4 attempts"
          exit 1
