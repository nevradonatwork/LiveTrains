name: Debug LDBWS shape (temporary)
on:
  push:
    branches: [claude/new-malden-waterloo-trains-2q5v0v]
    paths: [scripts/debug-ldbws.js, .github/workflows/debug-ldbws.yml]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/debug-ldbws.js
        env:
          LDBWS_API_KEY: ${{ secrets.CONSUMER_KEY }}
