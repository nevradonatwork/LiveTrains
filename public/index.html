<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveTrains &mdash; New Malden ⇄ Waterloo</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="app">
    <header>
      <h1 id="route-title">New Malden &rarr; London Waterloo</h1>
      <p class="subtitle">Live train departure board</p>
    </header>

    <div class="controls">
      <button id="toggle-btn" class="toggle-btn">Show Waterloo &rarr; New Malden trains</button>
      <button id="refresh-btn" class="refresh-btn" title="Refresh">&#8635;</button>
    </div>

    <div id="status" class="status"></div>

    <table class="board">
      <thead>
        <tr>
          <th>Time</th>
          <th>Expected</th>
          <th>Platform</th>
          <th>Destination</th>
          <th>Operator</th>
        </tr>
      </thead>
      <tbody id="board-body">
      </tbody>
    </table>

    <footer>
      <span id="last-updated"></span>
    </footer>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
