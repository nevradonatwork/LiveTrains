name: Update live departures

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live departures
        env:
          # raildata.org.uk issues this as "Consumer Key"; it's the value
          # sent as the x-apikey header to the LDBWS API.
          LDBWS_API_KEY: ${{ secrets.CONSUMER_KEY }}
          TRANSPORTAPI_APP_ID: ${{ secrets.TRANSPORTAPI_APP_ID }}
          TRANSPORTAPI_APP_KEY: ${{ secrets.TRANSPORTAPI_APP_KEY }}
        run: node scripts/fetch-departures.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/departures.json docs/data/errors.txt docs/data/transportapi-usage.json
          git diff --staged --quiet || git commit -m "Update live departures data"
          git push
